spring:
  application:
    name: enotes-api
  profiles:
      active: dev

---
# Dev profile configuration   
spring:
  config:
      activate: 
        on-profile: dev
  datasource:
    username: root
    password: Vinod@6891
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/enotes_dev      
  jpa:
    properties:
     hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
          ddl-auto: create
    show-sql: 'true'
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB  
  mail:
    host: smtp.gmail.com
    username: vin.sajgure@gmail.com
    password: txgfvwdhhpgktdnp
    port: '587'
    properties:
      mail:
        smtp:
          starttls:
            enable: 'true'
          auth: 'true'
file:
  upload:
    path: notes/
server:
  port: '8085'
  
